              value: 'my-cluster-kafka-bootstrap-kafka.apps.tiago-cluster.sandbox1433.opentlc.com:443'
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-auth
                  key: password
            - name: JAVA_APP_JAR
              value: /deployments/cons-kafka-prod-mqtt-1.0.0-SNAPSHOT-runner.jar
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          imagePullPolicy: Always
          volumeMounts:
            - name: truststore
              mountPath: /mnt/truststore
          terminationMessagePolicy: File
          image: quay.io/rh_ee_tavelino/cons-kafka-prod-mqtt:latest
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600