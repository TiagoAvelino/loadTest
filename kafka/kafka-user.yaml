# kafkauser-redhat-user.yaml
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: redhat-user
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  authentication:
    type: scram-sha-512
    # keep your external password secret wiring if you use it
    password:
      valueFrom:
        secretKeyRef:
          name: kafka-user-password
          key: kafka-user-password
  authorization:
    type: simple
    acls:
      # REQUIRED for the Console/AdminClient to discover the cluster
      - resource:
          type: cluster
        operations:
          - Describe
          - DescribeConfigs

      # You currently allow everything on topics and groups. Keep as-is or tighten later.
      - resource:
          type: topic
          name: "*"
          patternType: literal
        operations:
          - All
      - resource:
          type: group
          name: "*"
          patternType: literal
        operations:
          - All
