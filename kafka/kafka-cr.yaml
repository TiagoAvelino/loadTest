# ------------------------------
# 1) Kafka (cluster-level config)
# ------------------------------
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: my-cluster
  namespace: kafka
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: 4.0.0
    authorization:
      type: simple
    listeners:
      - name: plain
        type: internal
        port: 9092
        tls: false
      - name: tls
        type: internal
        port: 9093
        tls: true
      - name: external
        type: route        # OpenShift
        port: 9094
        tls: true
        authentication:
          type: scram-sha-512
    # NOTE: with node-pools enabled, replicas/storage are defined in KafkaNodePool, not here.
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}

---
# ------------------------------------
# 2) Controller node pool (required)
# ------------------------------------
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: my-cluster-controllers
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: persistent-claim
    class: gp3-csi
    size: 10Gi
    deleteClaim: true

---
# ------------------------------------
# 3) Broker node pool
# ------------------------------------
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: my-cluster-brokers
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  replicas: 6
  roles:
    - broker
  storage:
    type: persistent-claim
    class: gp3-csi
    size: 10Gi
    deleteClaim: true
