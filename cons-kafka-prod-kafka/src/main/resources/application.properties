# =========================
# App & logging
# =========================
quarkus.application.name=cons-kafka-prod-kafka
quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.kubernetes-client.trust-certs=true
# =========================
# OpenTelemetry (traces)
# =========================
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://dev-collector.openshift-tempo-operator.svc.cluster.local:4317}
quarkus.otel.exporter.otlp.traces.compression=gzip
quarkus.otel.exporter.otlp.traces.timeout=10s
# =========================
# Kafka bootstrap & security
# =========================
# Tip: prefer the internal bootstrap Service (lower latency):
# KAFKA_BOOTSTRAP_SERVERS=my-cluster-kafka-bootstrap.kafka:9093
quarkus.openshift.env.vars.KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:my-cluster-kafka-bootstrap.kafka:9093}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.security.protocol=SASL_SSL
kafka.sasl.mechanism=SCRAM-SHA-512
kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
# Mount truststore (OpenShift)
quarkus.openshift.mounts.truststore.path=/mnt/truststore
quarkus.openshift.secret-volumes.truststore.secret-name=kafka-client-ssl-secret
quarkus.openshift.env.mapping.TRUSTSTORE_PASSWORD.from-secret=kafka-client-ssl-secret
quarkus.openshift.env.mapping.TRUSTSTORE_PASSWORD.with-key=truststore-password
kafka.ssl.truststore.location=/mnt/truststore/truststore.jks
kafka.ssl.truststore.password=${TRUSTSTORE_PASSWORD}
kafka.ssl.truststore.type=JKS
# Map SASL envs from secret
quarkus.openshift.env.mapping.KAFKA_USERNAME.from-secret=kafka-auth
quarkus.openshift.env.mapping.KAFKA_USERNAME.with-key=username
quarkus.openshift.env.mapping.KAFKA_PASSWORD.from-secret=kafka-auth
quarkus.openshift.env.mapping.KAFKA_PASSWORD.with-key=password
# =========================
# Reactive Messaging (Kafka) — INCOMING channel
# =========================
# This service consumes from app.test.push and (in your code) publishes to MQTT.
mp.messaging.incoming."app.test.push".connector=smallrye-kafka
mp.messaging.incoming."app.test.push".topic=app.test.push
mp.messaging.incoming."app.test.push".group.id=cons-kafka-prod-kafka
mp.messaging.incoming."app.test.push".key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming."app.test.push".value.deserializer=org.acme.tracing.messageparams.MqttSendMessageKafkaDeserializer
# ---------- Low-latency consumer knobs ----------
# Deliver as soon as there's data; avoid batch waits.
mp.messaging.incoming."app.test.push".fetch.min.bytes=1
mp.messaging.incoming."app.test.push".fetch.max.wait.ms=20
# SmallRye poll timeout (keeps the poll cadence tight)
mp.messaging.incoming."app.test.push".poll-timeout=50
# Keep batches small to reduce per-poll "think time"
mp.messaging.incoming."app.test.push".max.poll.records=50
# Parallelize handler work if it’s CPU/IO heavy (idempotent/thread-safe)
mp.messaging.incoming."app.test.push".max-concurrency=4
# Keep consumer session responsive/stable
mp.messaging.incoming."app.test.push".session.timeout.ms=10000
mp.messaging.incoming."app.test.push".heartbeat.interval.ms=3000
# Start at the end if the group is new
mp.messaging.incoming."app.test.push".auto.offset.reset=latest
# Disable backpressure pausing on this channel
mp.messaging.incoming."app.test.push".pause-if-no-requests=false
# ------------------------------------------------
mqtt.topic.pattern=%s/%s
