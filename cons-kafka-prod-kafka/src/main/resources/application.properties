quarkus.application.name=cons-kafka-prod-kafka
# --- OpenTelemetry ---
quarkus.log.level=INFO
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://dev-collector.openshift-tempo-operator.svc.cluster.local:4317}
quarkus.openshift.env.vars.otel-exporter-otlp-endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://dev-collector.openshift-tempo-operator.svc.cluster.local:4317}
quarkus.openshift.env.vars.otel-exporter-otlp-insecure=${OTEL_EXPORTER_OTLP_INSECURE:true}
quarkus.kubernetes-client.trust-certs=true
# quarkus.s2i.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-21
# quarkus.openshift.deploy=true
# =====================  KAFKA CHANNELS  =====================
# ---- INCOMING (CONSUMER) from topic app.test.pull  ----
mp.messaging.incoming."app.test.pull".connector=smallrye-kafka
mp.messaging.incoming."app.test.pull".topic=app.test.pull
mp.messaging.incoming."app.test.pull".group.id=cons-kafka-prod-kafka
mp.messaging.incoming."app.test.pull".key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming."app.test.pull".value.deserializer=org.acme.tracing.messageparams.MqttSendMessageKafkaDeserializer
# Low-latency consumer fetch/poll
mp.messaging.incoming."app.test.pull".fetch.min.bytes=1
mp.messaging.incoming."app.test.pull".fetch.max.wait.ms=20
# SmallRye connector property (not the Kafka one): keep polls snappy
mp.messaging.incoming."app.test.pull".poll-timeout=50
# Keep batches small to reduce think-time; raise later if needed
mp.messaging.incoming."app.test.pull".max.poll.records=50
# Optional: manual commit if you need strict control (leave true for lowest latency)
# mp.messaging.incoming."app.test.pull".enable.auto.commit=true
mp.messaging.incoming."app.test.pull".auto.offset.reset=latest
# Parallel processing (if your code is thread-safe / idempotent)
mp.messaging.incoming."app.test.pull".max-concurrency=4
# ---- OUTGOING (PRODUCER) to topic app.test.push  ----
# mp.messaging.outgoing."app.test.push".connector=smallrye-kafka
# mp.messaging.outgoing."app.test.push".topic=app.test.push
# mp.messaging.outgoing."app.test.push".value.serializer=org.acme.tracing.messageparams.MqttSendMessageSerializer
# Optional key serializer if you set keys
# mp.messaging.outgoing."app.test.push".key.serializer=org.apache.kafka.common.serialization.StringSerializer
# Producer latency tweaks
# mp.messaging.outgoing."app.test.push".acks=1
# mp.messaging.outgoing."app.test.push".linger.ms=0
# Compression is fine but can add a few ms CPU; keep if throughput matters
# mp.messaging.outgoing."app.test.push".compression.type=snappy
# Batch size is OK; has little effect with linger=0 unless you burst
# mp.messaging.outgoing."app.test.push".batch.size=16384
# =====================  CLUSTER / SECURITY  =====================
# Prefer the in-cluster bootstrap Service if possible for lower latency; route shown here via env
quarkus.openshift.env.vars.KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:my-cluster-kafka-bootstrap.kafka:9093}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.security.protocol=SASL_SSL
kafka.sasl.mechanism=SCRAM-SHA-512
quarkus.openshift.env.mapping.KAFKA_USERNAME.from-secret=kafka-auth
quarkus.openshift.env.mapping.KAFKA_USERNAME.with-key=username
quarkus.openshift.env.mapping.KAFKA_PASSWORD.from-secret=kafka-auth
quarkus.openshift.env.mapping.KAFKA_PASSWORD.with-key=password
# JAAS and truststore
kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
quarkus.openshift.mounts.truststore.path=/mnt/truststore
quarkus.openshift.secret-volumes.truststore.secret-name=kafka-client-ssl-secret
quarkus.openshift.env.mapping.TRUSTSTORE_PASSWORD.from-secret=kafka-client-ssl-secret
quarkus.openshift.env.mapping.TRUSTSTORE_PASSWORD.with-key=truststore-password
kafka.ssl.truststore.location=/mnt/truststore/truststore.jks
kafka.ssl.truststore.password=${TRUSTSTORE_PASSWORD}
# kafka.ssl.truststore.type=JKS
