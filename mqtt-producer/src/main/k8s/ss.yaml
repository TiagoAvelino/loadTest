apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mqtt-producer
  namespace: kafka
  labels:
    app.kubernetes.io/managed-by: quarkus
    app.kubernetes.io/name: mqtt-producer
    app.kubernetes.io/version: 1.0.0-SNAPSHOT
    app.openshift.io/runtime: quarkus
  annotations:
    app.quarkus.io/commit-id: e1be31ab83f8577c8ca38c19c3acc33bb445d9d1
    app.quarkus.io/quarkus-version: 3.19.3
spec:
  serviceName: mqtt-producer-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mqtt-producer
      app.kubernetes.io/version: 1.0.0-SNAPSHOT
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqtt-producer
        app.kubernetes.io/version: 1.0.0-SNAPSHOT
      annotations:
        openshift.openshift.io/restartedAt: '2025-08-06T17:38:23.958Z'
    spec:
      containers:
        - name: mqtt-producer
          image: quay.io/rh_ee_tavelino/mqtt-producer:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JAVA_APP_JAR
              value: /deployments/quarkus-run.jar
            - name: SERVICE
              value: .mqtt-server-headless.kafka.svc.cluster.local:1883
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  revisionHistoryLimit: 10
