############################################
# ========== MQTT (SmallRye) ==============
############################################
mp.messaging.connector.smallrye-mqtt.host=${MQTT_HOST:}
mp.messaging.connector.smallrye-mqtt.port=${MQTT_PORT:1883}
mp.messaging.connector.smallrye-mqtt.client-id=${MQTT_CLIENT_ID:${quarkus.application.name}-app}
mp.messaging.connector.smallrye-mqtt.auto-reconnect=true
mp.messaging.connector.smallrye-mqtt.keep.alive.seconds=20
mp.messaging.connector.smallrye-mqtt.max-inflight-messages=5000
mp.messaging.connector.smallrye-mqtt.connect-timeout-seconds=5
mp.messaging.connector.smallrye-mqtt.ssl=${MQTT_SSL:false}
# --- OUTGOING channel (producer) ---
# Topic is set per-message in code (MqttMessage.of(topic,...)).
mp.messaging.outgoing.mqtt-out.connector=smallrye-mqtt
mp.messaging.outgoing.mqtt-out.qos=0
mp.messaging.outgoing.mqtt-out.auto-clean-session=true
mp.messaging.outgoing.mqtt-out.auto-generated-client-id=false
# --- INCOMING channel (consumer) ---
mp.messaging.incoming.mqtt-in.connector=smallrye-mqtt
mp.messaging.incoming.mqtt-in.topic=${MQTT_IN_TOPICS:teste}
mp.messaging.incoming.mqtt-in.qos=0
mp.messaging.incoming.mqtt-in.failure-strategy=ignore
# Worker pool used by @Blocking("mqtt-consumer")
smallrye.messaging.worker.mqtt-consumer.max-concurrency=${MQTT_CONSUMER_PARALLELISM:4}
############################################
# ============== APP TOGGLES ==============
############################################
mqtt.max.inflight=5000
mqtt.socket.send.buf.bytes=262144
mqtt.socket.recv.buf.bytes=262144
mqtt.keepalive.seconds=20
mqtt.connect.timeout.seconds=2
mqtt.consumer.parallelism=${MQTT_CONSUMER_PARALLELISM:8}
mqtt.consumer.queue.capacity=8192
mqtt.consumer.deserialize.enabled=${MQTT_DESER:true}
mqtt.tracing.enabled=${MQTT_TRACING:false}
# Helpers for your host initializer
quarkus.openshift.env.vars.POD_NAME=${POD_NAME:0}
quarkus.openshift.env.vars.SERVICE=${SERVICE:.mqtt-server-headless.kafka.svc.cluster.local:1883}
quarkus.kubernetes-client.trust-certs=true
############################################
# ============== TRACING ==================
############################################
# A) fully off (fast A/B):
quarkus.otel.sdk.disabled=${QUARKUS_OTEL_SDK_DISABLED:true}
# B) on + exporter (only used if sdk.disabled=false)
quarkus.otel.propagators=tracecontext,baggage
quarkus.otel.traces.sampler=${OTEL_SAMPLER:always_on}
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://dev-collector.openshift-tempo-operator.svc.cluster.local:4317}
quarkus.otel.exporter.otlp.traces.headers=${OTEL_EXPORTER_OTLP_HEADERS:}
quarkus.otel.exporter.otlp.traces.timeout=10S
# Tuned BSP (effective only when SDK enabled)
quarkus.otel.bsp.max.export.batch.size=${OTEL_BSP_MAX_BATCH:64}
quarkus.otel.bsp.max.queue.size=${OTEL_BSP_MAX_QUEUE:2048}
quarkus.otel.bsp.schedule.delay=${OTEL_BSP_DELAY:50ms}
quarkus.otel.bsp.export.timeout=${OTEL_BSP_EXPORT_TIMEOUT:5s}
############################################
# ============== LOGGING ==================
############################################
quarkus.log.min-level=${LOG_MIN_LEVEL:INFO}
quarkus.log.category."org.acme".level=${LOG_ACME_LEVEL:INFO}
quarkus.log.category."io.smallrye.reactive.messaging".level=${LOG_SRM_LEVEL:INFO}
quarkus.log.category."io.smallrye.reactive.messaging.mqtt".level=${LOG_SRMQTT_LEVEL:INFO}
quarkus.log.category."io.vertx.mqtt".level=${LOG_VERTX_MQTT_LEVEL:INFO}
# (Set the LOG_* variables as environment vars when you need DEBUG)
