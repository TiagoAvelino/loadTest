# =========================
# App & logging
# =========================
quarkus.application.name=mqtt-server
quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.kubernetes-client.trust-certs=true
quarkus.management.enabled=true
# =========================
# OpenTelemetry (traces)
# =========================
quarkus.otel.exporter.otlp.traces.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://dev-collector.openshift-tempo-operator.svc.cluster.local:4317}
# If you deploy with quarkus-openshift, also expose the same as envs (UPPERCASE!)
quarkus.openshift.env.vars.OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:http://dev-collector.openshift-tempo-operator.svc.cluster.local:4317}
quarkus.openshift.env.vars.OTEL_EXPORTER_OTLP_INSECURE=${OTEL_EXPORTER_OTLP_INSECURE:true}
# =========================
# MQTT consumer/broker config (used by @ConfigProperty)
# =========================
# Where the consumer connects (your embedded broker or an external one)
# NOTE: ENV var name is MQTT_URL (UPPERCASE, underscores) per MicroProfile rules.
mqtt.url=${MQTT_URL:${SERVICE:wss://localhost:8090}}
# Topic filter with wildcards
mqtt.topic.filter=${MQTT_TOPIC_FILTER:horus/api/200/external/MOV/+/+/monitor/state/pull/value}
# Lowest latency (0). Use 1 if you need at-least-once.
mqtt.subscribe.qos=${MQTT_SUBSCRIBE_QOS:0}
# Keep session across reconnects to avoid resubscribe delays
mqtt.cleanSession=${MQTT_CLEAN_SESSION:false}
# Reduce head-of-line blocking under bursts
mqtt.maxInflight=${MQTT_MAX_INFLIGHT:1024}
# Swap ".pull" -> ".push" when sending to Kafka (set false to disable)
mqtt.forward.replacePullWithPush=${MQTT_FORWARD_REPLACE_PULL_WITH_PUSH:true}
# Embedded Moquette (if this app also hosts the broker)
mqtt.broker.port=${MQTT_BROKER_PORT:1883}
mqtt.broker.ws.enabled=${MQTT_BROKER_WS_ENABLED:true}
mqtt.broker.ws.port=${MQTT_BROKER_WS_PORT:8090}
mqtt.broker.allowAnonymous=${MQTT_BROKER_ALLOWANONYMOUS:true}
mqtt.broker.usePersistentStore=${MQTT_BROKER_USEPERSISTENTSTORE:false}
# Optional: emit these as Pod env vars via quarkus-openshift (handy if you like to see them in the Deployment)
quarkus.openshift.env.vars.MQTT_URL=${MQTT_URL:${SERVICE:wss://localhost:8090}}
quarkus.openshift.env.vars.MQTT_TOPIC_FILTER=${MQTT_TOPIC_FILTER:horus/api/200/external/MOV/+/+/monitor/state/pull/value}
quarkus.openshift.env.vars.MQTT_SUBSCRIBE_QOS=${MQTT_SUBSCRIBE_QOS:0}
quarkus.openshift.env.vars.MQTT_CLEAN_SESSION=${MQTT_CLEAN_SESSION:false}
quarkus.openshift.env.vars.MQTT_MAX_INFLIGHT=${MQTT_MAX_INFLIGHT:1024}
quarkus.openshift.env.vars.MQTT_FORWARD_REPLACE_PULL_WITH_PUSH=${MQTT_FORWARD_REPLACE_PULL_WITH_PUSH:true}
quarkus.openshift.env.vars.MQTT_BROKER_PORT=${MQTT_BROKER_PORT:1883}
quarkus.openshift.env.vars.MQTT_BROKER_WS_ENABLED=${MQTT_BROKER_WS_ENABLED:true}
quarkus.openshift.env.vars.MQTT_BROKER_WS_PORT=${MQTT_BROKER_WS_PORT:8090}
quarkus.openshift.env.vars.MQTT_BROKER_ALLOWANONYMOUS=${MQTT_BROKER_ALLOWANONYMOUS:true}
quarkus.openshift.env.vars.MQTT_BROKER_USEPERSISTENTSTORE=${MQTT_BROKER_USEPERSISTENTSTORE:false}
# If you still want a generic SERVICE env that points at the broker URL:
quarkus.openshift.env.vars.SERVICE=${SERVICE:tcp://localhost:1883}
# =========================
# Kafka (SCRAM over SASL_SSL)
# =========================
# Bootstrap (also emitted as an env for visibility)
quarkus.openshift.env.vars.KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:my-cluster-kafka-bootstrap.kafka:9093}
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.security.protocol=SASL_SSL
kafka.sasl.mechanism=SCRAM-SHA-512
# Username/password from Secret
quarkus.openshift.env.mapping.KAFKA_USERNAME.from-secret=kafka-auth
quarkus.openshift.env.mapping.KAFKA_USERNAME.with-key=username
quarkus.openshift.env.mapping.KAFKA_PASSWORD.from-secret=kafka-auth
quarkus.openshift.env.mapping.KAFKA_PASSWORD.with-key=password
kafka.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
# Truststore from Secret
quarkus.openshift.mounts.truststore.path=/mnt/truststore
quarkus.openshift.secret-volumes.truststore.secret-name=kafka-client-ssl-secret
quarkus.openshift.env.mapping.TRUSTSTORE_PASSWORD.from-secret=kafka-client-ssl-secret
quarkus.openshift.env.mapping.TRUSTSTORE_PASSWORD.with-key=truststore-password
kafka.ssl.truststore.location=/mnt/truststore/truststore.jks
kafka.ssl.truststore.password=${TRUSTSTORE_PASSWORD}
# (Optional) Producer latency knobs if your KafkaSend uses standard Kafka config
kafka.acks=${KAFKA_ACKS:1}
kafka.linger.ms=${KAFKA_LINGER_MS:0}
kafka.batch.size=${KAFKA_BATCH_SIZE:32768}
kafka.max.in.flight.requests.per.connection=${KAFKA_MAX_IN_FLIGHT:5}
kafka.compression.type=${KAFKA_COMPRESSION:none}
quarkus.openshift.env.vars.POD_NAME=${POD_NAME:0}
mp.messaging.incoming.kafka-channel.topic=${POD_NAME}
# ===== REQUIRED by SmallRye Kafka Incoming (fixes your exception) =====
mp.messaging.incoming.kafka-channel.connector=smallrye-kafka
mp.messaging.incoming.kafka-channel.value.deserializer=org.acme.tracing.messageparams.MqttSendMessageKafkaDeserializer
# (optional but recommended)
mp.messaging.incoming.kafka-channel.group.id=${KAFKA_CONSUMER_GROUP:mqtt-server}
mp.messaging.incoming.kafka-channel.auto.offset.reset=${KAFKA_AUTO_OFFSET_RESET:latest}
# ===== Fast path for both producer & consumer (Paho) =====
mqtt.max.inflight=5000
mqtt.socket.send.buf.bytes=262144
mqtt.socket.recv.buf.bytes=262144
mqtt.keepalive.seconds=20
mqtt.connect.timeout.seconds=2
# ===== Consumer throughput (your code) =====
mqtt.consumer.parallelism=8
mqtt.consumer.queue.capacity=8192
mqtt.consumer.deserialize.enabled=true
